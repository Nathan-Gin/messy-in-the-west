<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="{{url_for('static', filename='game.css')}}" />
</head>
<body>
    <a href="{{url_for('index')}}">Home</a>
    <table>
        <tr>
            <th>Player</th>
            <th>Score</th>
        </tr>
        {%for row in leaderboard%}
            <tr>
                <td>{{row['user']}}</td>
                <td>{{row['score']}}</td>
            </tr>
        {%endfor%}
    </table>
</body>
</html>
